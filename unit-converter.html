<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter | EoNs Automation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 520px;
            margin: 0 auto;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #bbb;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button:hover {
            background: #0d47a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #1e1e1e;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            font-size: 20px;
            min-height: 30px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row > div {
            flex: 1;
        }
    </style>
</head>
<body>

    <h1>Unit Converter</h1>
    <p class="subtitle">EoNs Automation</p>

    <label for="category">Category</label>
    <select id="category" onchange="updateUnits()">
        <option value="length">Length</option>
        <option value="weight">Weight / Mass</option>
        <option value="temperature">Temperature</option>
        <option value="volume">Volume</option>
        <option value="area">Area</option>
        <option value="speed">Speed</option>
        <option value="time">Time</option>
        <option value="storage">Digital Storage</option>
        <option value="pressure">Pressure</option>
        <option value="energy">Energy</option>
    </select>

    <label for="value">Value</label>
    <input type="number" id="value" placeholder="Enter value" step="any">

    <div class="row">
        <div>
            <label for="fromUnit">From</label>
            <select id="fromUnit"></select>
        </div>
        <div>
            <label for="toUnit">To</label>
            <select id="toUnit"></select>
        </div>
    </div>

    <button onclick="convert()">Convert</button>

    <div class="result-box" id="result">Result will appear here</div>

    <script>
        const units = {
            length: {
                mm: 0.001, cm: 0.01, m: 1, km: 1000,
                in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.34, nmi: 1852
            },
            weight: {
                mg: 0.001, g: 1, kg: 1000, t: 1000000,
                oz: 28.3495, lb: 453.592, st: 6350.29
            },
            temperature: ["C", "F", "K"],
            volume: {
                ml: 0.001, l: 1, m3: 1000,
                tsp: 0.00492892, tbsp: 0.0147868,
                fl_oz: 0.0295735, cup: 0.236588,
                pt: 0.473176, qt: 0.946353, gal: 3.78541
            },
            area: {
                mm2: 0.000001, cm2: 0.0001, m2: 1, km2: 1000000,
                in2: 0.00064516, ft2: 0.092903, yd2: 0.836127,
                acre: 4046.86, ha: 10000
            },
            speed: {
                mps: 1, kph: 0.277778, mph: 0.44704,
                fps: 0.3048, knot: 0.514444
            },
            time: {
                ms: 0.001, s: 1, min: 60, hr: 3600,
                day: 86400, week: 604800, year: 31536000
            },
            storage: {
                b: 1, kb: 1000, mb: 1000000, gb: 1000000000, tb: 1e12,
                kib: 1024, mib: 1048576, gib: 1073741824, tib: 1099511627776
            },
            pressure: {
                pa: 1, kpa: 1000, bar: 100000,
                psi: 6894.76, atm: 101325, torr: 133.322
            },
            energy: {
                j: 1, kj: 1000, cal: 4.184, kcal: 4184,
                wh: 3600, kwh: 3600000, btu: 1055.06
            }
        };

        function updateUnits() {
            const category = document.getElementById("category").value;
            const fromSelect = document.getElementById("fromUnit");
            const toSelect = document.getElementById("toUnit");

            fromSelect.innerHTML = "";
            toSelect.innerHTML = "";

            let unitList;
            if (category === "temperature") {
                unitList = units.temperature;
            } else {
                unitList = Object.keys(units[category]);
            }

            unitList.forEach(unit => {
                fromSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
                toSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
            });
        }

        function convertTemperature(value, from, to) {
            let celsius;
            if (from === "C") celsius = value;
            else if (from === "F") celsius = (value - 32) * 5 / 9;
            else if (from === "K") celsius = value - 273.15;

            if (to === "C") return celsius;
            if (to === "F") return celsius * 9 / 5 + 32;
            if (to === "K") return celsius + 273.15;
        }

        function convert() {
            const category = document.getElementById("category").value;
            const value = parseFloat(document.getElementById("value").value);
            const fromUnit = document.getElementById("fromUnit").value;
            const toUnit = document.getElementById("toUnit").value;
            const resultBox = document.getElementById("result");

            if (isNaN(value)) {
                resultBox.textContent = "Please enter a valid number.";
                return;
            }

            let result;
            if (category === "temperature") {
                result = convertTemperature(value, fromUnit, toUnit);
                resultBox.textContent = `${value}°${fromUnit} = ${result.toFixed(4)}°${toUnit}`;
            } else {
                const dict = units[category];
                result = (value * dict[fromUnit]) / dict[toUnit];
                resultBox.textContent = `${value} ${fromUnit} = ${result.toFixed(6)} ${toUnit}`;
            }
        }

        // Initialize units on page load
        updateUnits();
    </script>

</body>
</html>
